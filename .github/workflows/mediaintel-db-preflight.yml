name: MediaIntel DB Connection Preflight

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mediaintel-db-preflight
  cancel-in-progress: false

jobs:
  verify-db-connection:
    name: Verify Supabase Database Connection
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PostgreSQL driver
        run: |
          python -m pip install "psycopg2-binary==2.9.10"

      - name: Execute read-only connection test
        env:
          MEDIAINTEL_DB_URL: ${{ secrets.MEDIAINTEL_DB_URL }}
        run: |
          python - <<'PY'
          import os
          import sys
          import psycopg2

          db_url = os.environ.get("MEDIAINTEL_DB_URL", "").strip()
          if not db_url:
              print("[FAIL] Required database secret is missing.")
              sys.exit(1)

          connection = None
          cursor = None
          try:
              connection = psycopg2.connect(
                  db_url,
                  connect_timeout=10,
                  sslmode="require",
              )
              connection.set_session(
                  readonly=True,
                  autocommit=False,
              )
              cursor = connection.cursor()
              cursor.execute("SELECT 1;")
              result = cursor.fetchone()
              if result != (1,):
                  print("[FAIL] Unexpected database test result.")
                  sys.exit(1)
              connection.rollback()
              print("[SUCCESS] GitHub Actions connected to Supabase.")
              print("[SUCCESS] Read-only SELECT 1 returned 1.")
              print("[SUCCESS] Database authentication verified.")
          except psycopg2.OperationalError as exc:
              message = str(exc).lower()
              if "password authentication failed" in message:
                  print("[FAIL] Database authentication rejected.")
              elif "could not translate host name" in message:
                  print("[FAIL] Database DNS resolution failed.")
              elif "timeout" in message:
                  print("[FAIL] Database connection timed out.")
              elif "ssl" in message:
                  print("[FAIL] Secure database connection failed.")
              else:
                  print("[FAIL] Database connectivity error.")
              sys.exit(1)
          except Exception:
              print("[FAIL] Unexpected database test error.")
              sys.exit(1)
          finally:
              if cursor is not None:
                  cursor.close()
              if connection is not None:
                  connection.close()
          PY
