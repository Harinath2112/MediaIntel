
name: MediaIntel Cloud Runner Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-cloud-runner:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout MediaIntel repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify cloud environment
        run: |
          echo "MediaIntel cloud runner started successfully"
          python --version
          python -c "import sys; print('Python executable:', sys.executable)"
          echo "GitHub Actions environment is ready"
