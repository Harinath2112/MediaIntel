name: MediaIntel Cloud Pipeline

# On-demand cloud execution for end-to-end YouTube intelligence.
# Triggered manually from the Streamlit Administrator Command Center.

on:
  workflow_dispatch:
    inputs:
      run_ingestion:
        description: 'Run YouTube data ingestion'
        required: true
        type: boolean
        default: true
      run_ai:
        description: 'Run RoBERTa sentiment, relevance, and anomaly analytics'
        required: true
        type: boolean
        default: true
      run_whisper:
        description: 'Run Storage-only Whisper worker for pending audio assets'
        required: true
        type: boolean
        default: true
      run_rpa:
        description: 'Run RPA report generation and artifact publishing'
        required: true
        type: boolean
        default: true
      send_email:
        description: 'Send email alerts via SMTP (requires SMTP secrets)'
        required: false
        type: boolean
        default: false
      channel_id:
        description: 'Specific YouTube Channel ID(s) to process (comma-separated, or empty for all enabled)'
        required: false
        type: string
        default: ''
      video_limit:
        description: 'Max videos per tracked channel to ingest (target 10 when available)'
        required: false
        type: string
        default: '10'
      comments_per_video:
        description: 'Max top-level comments per selected video (ordered by relevance)'
        required: false
        type: string
        default: '100'
      transcripts_per_channel:
        description: 'Latest published videos to select for transcription per channel (default 2)'
        required: false
        type: string
        default: '2'
      sentiment_limit:
        description: 'Max unanalysed comments to process with RoBERTa (0 for all pending up to safe time budget)'
        required: false
        type: string
        default: '0'
      force_retranscribe:
        description: 'Force re-transcription of completed videos'
        required: false
        type: boolean
        default: false
      whisper_model:
        description: 'Faster-Whisper model size (tiny | base | small)'
        required: false
        type: string
        default: 'tiny'
      caption_workers:
        description: 'Concurrent YouTube caption workers'
        required: false
        type: string
        default: '3'
      video_id:
        description: 'Specific YouTube Video ID for single-video transcription retry (optional)'
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: mediaintel-cloud-pipeline
  cancel-in-progress: false

jobs:
  ingest-youtube:
    name: Cloud YouTube Ingestion
    if: inputs.run_ingestion == true || inputs.run_ingestion == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-ingestion.txt

      - name: Install ingestion dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ingestion.txt

      - name: Verify required secrets
        env:
          MEDIAINTEL_DB_URL: ${{ secrets.MEDIAINTEL_DB_URL }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          test -n "$MEDIAINTEL_DB_URL" || { echo "Missing MEDIAINTEL_DB_URL"; exit 1; }
          test -n "$YOUTUBE_API_KEY" || { echo "Missing YOUTUBE_API_KEY"; exit 1; }
          echo "Configuration verified for ingestion."

      - name: Ingest latest competitor videos and comments
        env:
          MEDIAINTEL_DB_URL: ${{ secrets.MEDIAINTEL_DB_URL }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          MEDIAINTEL_CHANNEL_SOURCE: database
          INPUT_VIDEO_LIMIT: ${{ inputs.video_limit }}
          INPUT_COMMENTS_PER_VIDEO: ${{ inputs.comments_per_video }}
          MEDIAINTEL_INGEST_CHANNEL_ID: ${{ inputs.channel_id }}
          COMMENT_PAGES: '1'
          INGEST_WORKERS: '2'
        run: |
          LIMIT="${INPUT_VIDEO_LIMIT:-10}"
          COMMENTS_LIMIT="${INPUT_COMMENTS_PER_VIDEO:-100}"
          export MEDIAINTEL_INGEST_VIDEO_LIMIT="$LIMIT"
          export MEDIAINTEL_INGEST_COMMENTS_PER_VIDEO="$COMMENTS_LIMIT"
          python -m core.youtube_ingest

  whisper-transcription:
    name: Cloud Whisper Transcription & Caption Processing
    needs: [ingest-youtube]
    if: always() && (inputs.run_whisper == true || inputs.run_whisper == 'true') && (needs.ingest-youtube.result == 'success' || needs.ingest-youtube.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-whisper.txt

      - name: Install FFmpeg and Whisper dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          python -m pip install -r requirements-whisper.txt

      - name: Verify Supabase and database configuration
        env:
          MEDIAINTEL_DB_URL: ${{ secrets.MEDIAINTEL_DB_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || vars.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          test -n "$MEDIAINTEL_DB_URL" || { echo "Missing MEDIAINTEL_DB_URL"; exit 1; }
          python -m core.config || { echo "Database connectivity preflight failed"; exit 1; }
          echo "Storage and database configuration verified."

      - name: Acquire audio and transcribe via Faster-Whisper / Captions
        env:
          MEDIAINTEL_DB_URL: ${{ secrets.MEDIAINTEL_DB_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || vars.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          INPUT_TRANSCRIPTS_PER_CHANNEL: ${{ inputs.transcripts_per_channel }}
          INPUT_FORCE_RETRANSCRIBE: ${{ inputs.force_retranscribe }}
          INPUT_WHISPER_MODEL: ${{ inputs.whisper_model }}
          INPUT_CAPTION_WORKERS: ${{ inputs.caption_workers }}
          INPUT_VIDEO_ID: ${{ inputs.video_id }}
          WHISPER_MODEL: ${{ inputs.whisper_model || 'tiny' }}
          WHISPER_COMPUTE: int8
          OMP_NUM_THREADS: '2'
        run: |
          TRANS_LIMIT="${INPUT_TRANSCRIPTS_PER_CHANNEL:-2}"
          MODEL="${INPUT_WHISPER_MODEL:-tiny}"
          WORKERS="${INPUT_CAPTION_WORKERS:-3}"
          EXTRA_ARGS=""
          if [ "$INPUT_FORCE_RETRANSCRIBE" = "true" ]; then
            EXTRA_ARGS="--force-retranscribe"
          fi
          TARGET_VID="${INPUT_VIDEO_ID:-}"
          if [ -n "$TARGET_VID" ]; then
            EXTRA_ARGS="$EXTRA_ARGS --video-id $TARGET_VID"
          fi
          python -m core.cloud_whisper_worker --limit "$TRANS_LIMIT" --max-seconds 1800 --whisper-model "$MODEL" --caption-workers "$WORKERS" $EXTRA_ARGS

  ai-analytics:
    name: Cloud AI & Analytics Pipeline
    needs: [ingest-youtube, whisper-transcription]
    if: |
      always() &&
      (inputs.run_ai == true || inputs.run_ai == 'true') &&
      (needs.ingest-youtube.result == 'success' || needs.ingest-youtube.result == 'skipped') &&
      (needs.whisper-transcription.result == 'success' || needs.whisper-transcription.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-ai.txt

      - name: Install AI dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ai.txt

      - name: Verify database preflight
        env:
          MEDIAINTEL_DB_URL: ${{ secrets.MEDIAINTEL_DB_URL }}
        run: |
          test -n "$MEDIAINTEL_DB_URL" || { echo "Missing MEDIAINTEL_DB_URL"; exit 1; }
          python -m core.config || { echo "Database preflight failed"; exit 1; }
          echo "Database configuration verified for AI stages."

      - name: Run RoBERTa sentiment and ABSA analysis
        env:
          MEDIAINTEL_DB_URL: ${{ secrets.MEDIAINTEL_DB_URL }}
          INPUT_SENTIMENT_LIMIT: ${{ inputs.sentiment_limit }}
          MAX_COMMENTS_PER_VIDEO: '0'
          SENTIMENT_BATCH: '8'
          NLP_CHUNK: '200'
          QUANTIZE: '0'
          OMP_NUM_THREADS: '2'
          MKL_NUM_THREADS: '2'
          TOKENIZERS_PARALLELISM: 'false'
        run: |
          LIMIT="${INPUT_SENTIMENT_LIMIT:-0}"
          if [ "$LIMIT" = "0" ] || [ -z "$LIMIT" ]; then
            python -m core.nlp_pipeline --time-budget 24
          else
            python -m core.nlp_pipeline --limit "$LIMIT" --time-budget 24
          fi

      - name: Compute relevance and next-video topic suggestions
        env:
          MEDIAINTEL_DB_URL: ${{ secrets.MEDIAINTEL_DB_URL }}
        run: |
          python -m core.relevance_topics

      - name: Detect metric anomalies and velocity spikes
        env:
          MEDIAINTEL_DB_URL: ${{ secrets.MEDIAINTEL_DB_URL }}
        run: |
          python -m core.anomaly_alert

  rpa-reporting:
    name: Cloud RPA & Intelligence Reporting
    needs: [ingest-youtube, whisper-transcription, ai-analytics]
    if: |
      always() &&
      (inputs.run_rpa == true || inputs.run_rpa == 'true') &&
      (needs.ingest-youtube.result == 'success' || needs.ingest-youtube.result == 'skipped') &&
      (needs.whisper-transcription.result == 'success' || needs.whisper-transcription.result == 'skipped') &&
      (needs.ai-analytics.result == 'success' || needs.ai-analytics.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-rpa.txt

      - name: Install RPA dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-rpa.txt

      - name: Verify database secret
        env:
          MEDIAINTEL_DB_URL: ${{ secrets.MEDIAINTEL_DB_URL }}
        run: |
          test -n "$MEDIAINTEL_DB_URL" || { echo "Missing MEDIAINTEL_DB_URL"; exit 1; }
          echo "Database configuration verified for RPA reporting."

      - name: Prepare alert summary from database
        env:
          MEDIAINTEL_DB_URL: ${{ secrets.MEDIAINTEL_DB_URL }}
        run: |
          python -c "from core import anomaly_alert; r, t = anomaly_alert.alerts_for_report(); anomaly_alert.write_summary(r, t)"

      - name: Run Robot Framework RPA Suite
        env:
          MEDIAINTEL_DB_URL: ${{ secrets.MEDIAINTEL_DB_URL }}
          RPA_DRY_RUN: ${{ (inputs.send_email == true || inputs.send_email == 'true') && '0' || '1' }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '587' }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_RECIPIENT: ${{ secrets.ALERT_RECIPIENT }}
          EMAIL_MODE: ${{ secrets.EMAIL_MODE || 'always' }}
        run: |
          python -m robot --rpa --outputdir data/rpa_logs --pythonpath rpa --output rpa_output.xml --log rpa_log.html --report rpa_report.html rpa/mediaintel_rpa.robot

      - name: Upload RPA and Intelligence Report Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mediaintel-reports-${{ github.run_id }}
          path: |
            outputs/MediaIntel_Dashboard_Documentation.pdf
            outputs/Content_Strategy_Report.txt
            outputs/AlertSummary.txt
            outputs/archive/*.pdf
            data/rpa_logs/rpa_report.html
            data/rpa_logs/rpa_log.html
            data/rpa_logs/dispatch_result.json
          if-no-files-found: warn
          retention-days: 14

