name: MediaIntel Cloud Whisper Worker

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mediaintel-cloud-whisper
  cancel-in-progress: false

jobs:
  cloud-whisper:
    name: Storage-only Whisper transcription
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-whisper.txt

      - name: Install FFmpeg and Whisper dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          python -m pip install -r requirements-whisper.txt

      - name: Verify required configuration
        env:
          MEDIAINTEL_DB_URL: ${{ secrets.MEDIAINTEL_DB_URL }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          test -n "$MEDIAINTEL_DB_URL" || { echo "Missing MEDIAINTEL_DB_URL"; exit 1; }
          test -n "$SUPABASE_URL" || { echo "Missing SUPABASE_URL"; exit 1; }
          test -n "$SUPABASE_SECRET_KEY" || { echo "Missing SUPABASE_SECRET_KEY"; exit 1; }
          echo "Required configuration is present."

      - name: Run Storage-only Whisper worker
        env:
          MEDIAINTEL_DB_URL: ${{ secrets.MEDIAINTEL_DB_URL }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          WHISPER_MODEL: tiny
          WHISPER_COMPUTE: int8
          OMP_NUM_THREADS: '2'
        run: |
          python -m core.cloud_whisper_worker --limit 1 --max-seconds 600
